          teammate_spacing: 0.5   # spacing between agents along y-axis                                                                                                                              
          initial_height: 1.0     # nominal z position                                                                                                                                               
          x_half: 0.1             # spawn within ±x_half of nominal x                                                                                                                                   
          y_half: 0.1             # spawn within ±y_half of nominal y                                                                                                                                   
          z_half: 0.1             # spawn within ±z_half of nominal z 
        min_spawn_distance: 0.6  # > collision tolerance to avoid immediate collision
