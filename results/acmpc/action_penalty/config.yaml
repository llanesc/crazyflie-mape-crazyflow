# Experiment: box_random_spawn
# ACMPC policy with box random spawn positions

# Environment settings
environment:
  n_pairs: 2
  pursuer_strategy: "TPN"  # "PP", "ProNav", "AugProNav", or "TPN"
  drone_model: "cf2x_T350"

  # Simulation frequencies
  sim_freq: 500
  mellinger_freq: 500
  control_freq: 50
  episode_length_s: 20.0

  # Collision tolerances
  bb_collision_tolerance: 0.2
  rr_collision_tolerance: 0.2
  rb_collision_tolerance: 0.2

  # Boundary settings
  boundary_size: 5.0
  min_altitude: 0.5
  max_altitude: 2.0

  # Spawn settings (default, overridden by curriculum levels)
  spawn:
    blue:
      method: "box_random"
      x_min: -0.5
      x_max: 0.5
      y_half: 1.0
      z_min: 0.8
      z_max: 1.2
    red:
      method: "box_random"
      x_min: 2.5
      x_max: 3.5
      y_half: 1.0
      z_min: 0.8
      z_max: 1.2

  # Pursuit gains (Augmented ProNav) - used when pursuer_strategy: "AugProNav"
  N_gain: 5.0  # Navigation constant
  V_min: 0.75   # Minimum speed floor [m/s]
  K_v: 3.0     # Speed floor gain

  # Pursuit gains (Pure Pursuit)
  pp_k_pxy: 6.1624
  pp_k_vxy: 3.39
  pp_k_pz: 20.0
  pp_k_vz: 10.0

  # Target assignment
  random_target_assignment: true  # true for random, false for deterministic (red_i -> blue_i)

  # Physical parameters (optional overrides)
  mass: 0.0416  # Override drone mass [kg], if not set uses drone_model default
  thrust_min: 0.204048  # 0.5 * 0.0416 * 9.81 [N]
  thrust_max: 0.612144  # 1.5 * 0.0416 * 9.81 [N]

  # Domain randomization
  randomize_mass: false  # Randomize mass with normal distribution
  randomize_inertia: false  # Randomize inertia with normal distribution
  mass_randomization_std: 0.003  # Standard deviation for mass randomization [kg]
  inertia_randomization_std: 3.0e-6  # Standard deviation for inertia randomization [kg*m^2]

  # Disturbance forces/torques
  enable_disturbance: false  # Enable random disturbance forces and torques
  disturbance_force_std: 0.01  # Standard deviation for force disturbance [N]
  disturbance_torque_std: 1.0e-4  # Standard deviation for torque disturbance [Nm]

# Policy settings (ACMPC specific)
policy:
  # Cost formulation: "qp" (J=0.5*x'Qx + p'x) or "linear_ls" (J=0.5*||y-y_ref||_W^2)
  cost_type: "linear_ls"
  pos_offset_max: 0.25  # Max position reference offset [m] (LINEAR_LS only)

  # MPC settings
  mpc_model: "so_rpy_rotor_drag"  # "so_rpy" or "so_rpy_rotor_drag"
  mpc_horizon: 2
  mpc_dt: 0.02
  mpc_velocity_max: null  # null to disable, or float value in m/s

  # Control limits
  roll_pitch_max: 0.2
  yaw_max: 0.01

  # Network architecture
  cost_net_sizes: [256, 256]
  value_net_sizes: [256, 256]

  # Activation functions (options: relu, tanh, elu, leaky_relu, gelu)
  cost_net_activation: "relu"
  value_activation: "relu"

  # Exploration
  initial_log_std: [-0.5, -0.5, -1, -1.3]  # or a scalar (e.g. -0.5)

# Training settings
training:
  timesteps: 2_000_000
  n_worlds: 128
  device: "cpu"  # "cpu" or "cuda"

  # PPO hyperparameters
  rollouts: 256
  learning_epochs: 4
  mini_batches: 4
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  grad_norm_clip: 0.5
  entropy_loss_scale: 0.01
  value_loss_scale: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  kl_threshold: 0.0

  # Preprocessors (optional)
  # Options: "RunningStandardScaler" or null (no preprocessing)
  observation_preprocessor: null
  state_preprocessor: null
  value_preprocessor: "RunningStandardScaler"

  # Learning rate scheduler (optional)
  # Options: "KLAdaptiveLR", "StepLR", or null (no scheduler)
  # KLAdaptiveLR kwargs: kl_threshold
  # StepLR kwargs: step_size, gamma
  learning_rate_scheduler: "LinearLR"
  learning_rate_scheduler_kwargs:
    start_factor: 1.0
    end_factor: 0.0333    # decay to 1e-5 (= 3e-4 * 0.0333)
    total_iters: 31250    # 2M world steps / 256 rollout * 4 scheduler steps per rollout

# Reward settings
rewards:
  capture: -5.0
  red_crash: 30.0
  rr_relative_velocity_coef: 1.0  # Bonus for red-red collisions scaled by ||v_rel||
  blue_crash: -5.0
  boundary: -5.0
  pursuer_proximity: 0.3
  pursuer_proximity_decay: 2.5
  # Angle penalty (penalizes orientation deviation from level flight)
  angle_coef: 0.01
  # Action penalties (energy and smoothness)
  action_coef: 0.5
  action_smoothness_thrust: 5.0
  action_smoothness_rpy: 1.0
  velocity_coef: 0.03
  # Ground proximity penalty (exponential, ~0 at hover, max at min_altitude)
  ground_proximity_coef: 0.0
  ground_proximity_decay: 6.0

# Curriculum learning settings
curriculum:
  enabled: true
  advance_threshold: 0.70  # fraction of blue wins to advance to next level

  levels:
    - level: 0
      spawn:
        blue:
          method: "deterministic"
          x: 0.0
          teammate_spacing: 1.0
          initial_height: 1.0
