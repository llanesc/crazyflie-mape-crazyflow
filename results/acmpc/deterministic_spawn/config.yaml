# Experiment: deterministic_spawn
# ACMPC policy with deterministic spawn positions

# Environment settings
environment:
  n_pairs: 2
  pursuer_strategy: "ProNav"  # "PP", "ProNav", or "AugProNav"
  drone_model: "cf2x_L250"

  # Simulation frequencies
  sim_freq: 500
  mellinger_freq: 500
  control_freq: 100
  episode_length_s: 20.0

  # Collision tolerances
  bb_crash_tolerance: 0.2
  rr_crash_tolerance: 0.2
  br_crash_tolerance: 0.2

  # Boundary settings
  boundary_size: 3.0
  min_altitude: 0.1
  max_altitude: 3.0

  # Spawn settings
  spawn:
    blue:
      method: "deterministic"
      x: 2.0
      teammate_spacing: 0.5
      initial_height: 1.0
    red:
      method: "deterministic"
      x: 0.0
      teammate_spacing: 0.5
      initial_height: 1.0

  # Pursuit gains (ProNav)
  N_pronav_fb: 5.0
  N_pronav_ff: 1.0
  velocity_closure_threshold: 0.5

  # Pursuit gains (Augmented ProNav) - used when pursuer_strategy: "AugProNav"
  N_gain: 3.0  # Navigation constant
  V_min: 0.5   # Minimum speed floor [m/s]
  K_v: 2.5     # Speed floor gain

  # Pursuit gains (Pure Pursuit)
  pp_k_pxy: 6.1624
  pp_k_vxy: 3.39
  pp_k_pz: 20.0
  pp_k_vz: 10.0

  # Target assignment
  random_target_assignment: false  # true for random, false for deterministic (red_i -> blue_i)

# Policy settings (ACMPC specific)
policy:
  # MPC settings
  mpc_horizon: 2
  mpc_dt: 0.01
  mpc_velocity_max: null  # null to disable, or float value in m/s

  # Control limits
  roll_pitch_max: 0.5
  yaw_max: 0.5

  # Network architecture
  cost_net_sizes: [256, 256]
  value_net_sizes: [256, 256]

  # Activation functions (options: relu, tanh, elu, leaky_relu, gelu)
  cost_net_activation: "relu"
  value_activation: "relu"

  # Exploration
  initial_log_std: -1.2

# Training settings
training:
  timesteps: 1_000_000
  n_worlds: 64
  device: "cpu"  # "cpu" or "cuda"

  # PPO hyperparameters
  rollouts: 256
  learning_epochs: 8
  mini_batches: 4
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  grad_norm_clip: 0.5
  entropy_loss_scale: 0.01
  value_loss_scale: 2.0
  ratio_clip: 0.2
  value_clip: 0.2
  kl_threshold: 0.0

  # Value preprocessor (optional)
  # Options: "RunningStandardScaler" or null (no preprocessing)
  value_preprocessor: null

  # Learning rate scheduler (optional)
  # Options: "KLAdaptiveLR", "StepLR", or null (no scheduler)
  # KLAdaptiveLR kwargs: kl_threshold
  # StepLR kwargs: step_size, gamma
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.0

# Reward settings
rewards:
  capture: -30.0
  red_crash: 20.0
  blue_crash: -20.0
  boundary: -5.0
  alive: 0.1
  pursuer_proximity: 0.5
  pursuer_proximity_decay: 2.0
