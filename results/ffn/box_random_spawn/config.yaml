# Experiment: box_random_spawn
# FFN policy with box random spawn positions

# Environment settings
environment:
  n_pairs: 2
  pursuer_strategy: "ProNav"  # "PP", "ProNav", or "AugProNav"
  drone_model: "cf2x_L250"

  # Simulation frequencies
  sim_freq: 500
  mellinger_freq: 500
  control_freq: 100
  episode_length_s: 20.0

  # Collision tolerances
  bb_crash_tolerance: 0.2
  rr_crash_tolerance: 0.2
  br_crash_tolerance: 0.2

  # Boundary settings
  boundary_size: 6.0
  min_altitude: 0.1
  max_altitude: 3.0

  # Spawn settings
  spawn:
    blue:
      method: "box_random"
      x_min: 3.5
      x_max: 4.5
      y_half: 1.0
      z_min: 0.8
      z_max: 1.2
    red:
      method: "box_random"
      x_min: -0.5
      x_max: 0.5
      y_half: 1.0
      z_min: 0.8
      z_max: 1.2

  # Pursuit gains (ProNav)
  N_pronav_fb: 5.0
  N_pronav_ff: 1.0
  velocity_closure_threshold: 0.5

  # Pursuit gains (Augmented ProNav) - used when pursuer_strategy: "AugProNav"
  N_gain: 3.0  # Navigation constant
  V_min: 0.5   # Minimum speed floor [m/s]
  K_v: 2.5     # Speed floor gain

  # Pursuit gains (Pure Pursuit)
  pp_k_pxy: 6.1624
  pp_k_vxy: 3.39
  pp_k_pz: 20.0
  pp_k_vz: 10.0

  # Target assignment
  random_target_assignment: true  # true for random, false for deterministic (red_i -> blue_i)

# Policy settings (FFN specific)
policy:
  # Control limits
  roll_pitch_max: 0.5
  yaw_max: 0.1

  # Network architecture
  policy_net_sizes: [256, 256]
  value_net_sizes: [256, 256]

  # Activation functions (options: relu, tanh, elu, leaky_relu, gelu)
  policy_activation: "relu"
  value_activation: "relu"

  # Exploration
  initial_log_std: [-0.5, -0.5, -1, -0.5]  # or a scalar (e.g. -0.5)

# Training settings
training:
  timesteps: 1_000_000
  n_worlds: 64
  device: "cpu"  # "cpu" or "cuda"

  # PPO hyperparameters
  rollouts: 1024
  learning_epochs: 5
  mini_batches: 4 # n_worlds * rollouts / 16384
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  grad_norm_clip: 0.5
  entropy_loss_scale: 0.01
  value_loss_scale: 2.0
  ratio_clip: 0.2
  value_clip: 0.2

  # Value preprocessor (optional)
  # Options: "RunningStandardScaler" or null (no preprocessing)
  value_preprocessor: "RunningStandardScaler"

  # Learning rate scheduler (optional)
  # Options: "KLAdaptiveLR", "StepLR", or null (no scheduler)
  # KLAdaptiveLR kwargs: kl_threshold # see https://skrl.readthedocs.io/en/latest/api/resources/schedulers/kl_adaptive.html
  # StepLR kwargs: step_size, gamma
  learning_rate_scheduler: "StepLR"
  learning_rate_scheduler_kwargs:
    step_size: 100_000
    gamma: 0.9

# Reward settings
rewards:
  capture: -5.0
  red_crash: 5.0
  blue_crash: -5.0
  boundary: -5.0
  alive: 0.1
  pursuer_proximity: 0.5
  pursuer_proximity_decay: 2.0
