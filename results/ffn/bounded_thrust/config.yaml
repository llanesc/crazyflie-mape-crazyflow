# Experiment: box_random_spawn
# ACMPC policy with box random spawn positions

# Environment settings
environment:
  n_pairs: 2
  pursuer_strategy: "AugProNav"  # "PP", "ProNav", "AugProNav", or "TPN"
  drone_model: "cf2x_T350"

  # Simulation frequencies
  sim_freq: 500
  mellinger_freq: 500
  control_freq: 100
  episode_length_s: 20.0

  # Collision tolerances
  bb_collision_tolerance: 0.2
  rr_collision_tolerance: 0.2
  rb_collision_tolerance: 0.2

  # Boundary settings
  boundary_size: 3.0
  min_altitude: 0.1
  max_altitude: 2.0

  # Spawn settings (default, overridden by curriculum levels)
  spawn:
    blue:
      method: "box_random"
      x_min: 1.5
      x_max: 2.5
      y_half: 1.0
      z_min: 0.8
      z_max: 1.2
    red:
      method: "box_random"
      x_min: -0.5
      x_max: 0.5
      y_half: 1.0
      z_min: 0.8
      z_max: 1.2

  # Pursuit gains (ProNav)
  N_pronav_fb: 5.0
  N_pronav_ff: 1.0
  velocity_closure_threshold: 0.1

  # Pursuit gains (Augmented ProNav) - used when pursuer_strategy: "AugProNav"
  N_gain: 3.0  # Navigation constant
  V_min: 0.3   # Minimum speed floor [m/s]
  K_v: 2.5     # Speed floor gain

  # Pursuit gains (Pure Pursuit)
  pp_k_pxy: 6.1624
  pp_k_vxy: 3.39
  pp_k_pz: 20.0
  pp_k_vz: 10.0

  # Target assignment
  random_target_assignment: true  # true for random, false for deterministic (red_i -> blue_i)

  # Physical parameters (optional mass override)
  # mass: 0.032  # Override drone mass [kg], if not set uses drone_model default

  # Domain randomization
  randomize_mass: false  # Randomize mass with normal distribution
  randomize_inertia: false  # Randomize inertia with normal distribution
  mass_randomization_std: 0.002  # Standard deviation for mass randomization [kg]
  inertia_randomization_std: 3.0e-6  # Standard deviation for inertia randomization [kg*m^2]

  # Disturbance forces/torques
  enable_disturbance: false  # Enable random disturbance forces and torques
  disturbance_force_std: 0.01  # Standard deviation for force disturbance [N]
  disturbance_torque_std: 1.0e-4  # Standard deviation for torque disturbance [Nm]

# Policy settings (FFN specific)
policy:
  # Control limits
  roll_pitch_max: 0.5
  yaw_max: 0.1

  # Network architecture
  policy_net_sizes: [256, 256]
  value_net_sizes: [256, 256]

  # Activation functions (options: relu, tanh, elu, leaky_relu, gelu)
  policy_activation: "relu"
  value_activation: "relu"

  # Exploration
  initial_log_std: [-0.9, -0.9, -1, -0.9]  # or a scalar (e.g. -0.5)

# Training settings
training:
  timesteps: 2_500_000
  n_worlds: 128
  device: "cpu"  # "cpu" or "cuda"

  # PPO hyperparameters
  rollouts: 256
  learning_epochs: 8
  mini_batches: 4
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  grad_norm_clip: 0.5
  entropy_loss_scale: 0.01
  value_loss_scale: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  kl_threshold: 0.0

  # Value preprocessor (optional)
  # Options: "RunningStandardScaler" or null (no preprocessing)
  value_preprocessor: null

  # Learning rate scheduler (optional)
  # Options: "KLAdaptiveLR", "StepLR", or null (no scheduler)
  # KLAdaptiveLR kwargs: kl_threshold
  # StepLR kwargs: step_size, gamma
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.0

# Reward settings
rewards:
  capture: -10.0
  red_crash: 50.0
  blue_crash: -10.0
  boundary: -10.0
  alive: 0.05
  pursuer_proximity: 0.1
  pursuer_proximity_decay: 2.5
  # Angle penalty (penalizes orientation deviation from level flight)
  angle_coef: 0.08
  # Action penalties (energy and smoothness)
  action_coef: 0.01
  action_smoothness_thrust: 0.2
  action_smoothness_rpy: 0.4

# Curriculum learning settings
curriculum:
  enabled: true
  advance_threshold: 0.8  # fraction of blue wins to advance to next level

  levels:
    - level: 0
      spawn:
        blue:
          method: "deterministic"
          x: 2.0
          teammate_spacing: 0.5
          initial_height: 1.0
        red:                                                                                                                                                                                        
          method: "nominal_box"                                                                                                                                                                      
          x: 0.0                  # nominal x position for all red agents                                                                                                                           
          teammate_spacing: 0.5   # spacing between agents along y-axis                                                                                                                              
          initial_height: 1.0     # nominal z position                                                                                                                                               
          x_half: 0.1             # spawn within ±x_half of nominal x                                                                                                                                   
          y_half: 0.1             # spawn within ±y_half of nominal y                                                                                                                                   
          z_half: 0.1             # spawn within ±z_half of nominal z 
        min_spawn_distance: 0.6  # > collision tolerance to avoid immediate collision
      bb_collision_tolerance: 0.5
      rr_collision_tolerance: 0.5
      rb_collision_tolerance: 0.5

    - level: 1
      spawn:
        blue:
          method: "deterministic"
          x: 2.0
          teammate_spacing: 0.5
          initial_height: 1.0
        red:                                                                                                                                                                                        
          method: "nominal_box"                                                                                                                                                                      
          x: 0.0                  # nominal x position for all red agents                                                                                                                           
          teammate_spacing: 0.7   # spacing between agents along y-axis                                                                                                                              
          initial_height: 1.0     # nominal z position                                                                                                                                               
          x_half: 0.4             # spawn within ±x_half of nominal x                                                                                                                                   
          y_half: 0.4             # spawn within ±y_half of nominal y                                                                                                                                   
          z_half: 0.4             # spawn within ±z_half of nominal z 
        min_spawn_distance: 0.5  # > collision tolerance to avoid immediate collision
      bb_collision_tolerance: 0.4
      rr_collision_tolerance: 0.4
      rb_collision_tolerance: 0.4

    - level: 2
      spawn:
        blue:
          method: "deterministic"
          x: 2.0
          teammate_spacing: 0.5
          initial_height: 1.0
        red:                                                                                                                                                                                        
          method: "nominal_box"                                                                                                                                                                      
          x: 0.0                  # nominal x position for all red agents                                                                                                                           
          teammate_spacing: 1.0   # spacing between agents along y-axis                                                                                                                              
          initial_height: 1.0     # nominal z position                                                                                                                                               
          x_half: 0.6             # spawn within ±x_half of nominal x                                                                                                                                   
          y_half: 0.6             # spawn within ±y_half of nominal y                                                                                                                                   
          z_half: 0.4             # spawn within ±z_half of nominal z 
        min_spawn_distance: 0.5  # > collision tolerance to avoid immediate collision
      bb_collision_tolerance: 0.35
      rr_collision_tolerance: 0.35
      rb_collision_tolerance: 0.35

    - level: 3
      spawn:
        blue:
          method: "deterministic"
          x: 2.0
          teammate_spacing: 0.5
          initial_height: 1.0
        red:                                                                                                                                                                                        
          method: "nominal_box"                                                                                                                                                                      
          x: 0.0                  # nominal x position for all red agents                                                                                                                           
          teammate_spacing: 1.5   # spacing between agents along y-axis                                                                                                                              
          initial_height: 1.0     # nominal z position                                                                                                                                               
          x_half: 0.8             # spawn within ±x_half of nominal x                                                                                                                                   
          y_half: 0.8             # spawn within ±y_half of nominal y                                                                                                                                   
          z_half: 0.4             # spawn within ±z_half of nominal z 
        min_spawn_distance: 0.5  # > collision tolerance to avoid immediate collision
      bb_collision_tolerance: 0.3
      rr_collision_tolerance: 0.3
      rb_collision_tolerance: 0.3

    - level: 4
      spawn:
        blue:
          method: "deterministic"
          x: 2.0
          teammate_spacing: 0.5
          initial_height: 1.0
        red:
          method: "box_random"
          x_min: -0.5
          x_max: 0.5
          y_half: 1.0
          z_min: 0.8
          z_max: 1.2
        min_spawn_distance: 0.5  # > collision tolerance to avoid immediate collision
      bb_collision_tolerance: 0.2
      rr_collision_tolerance: 0.2
      rb_collision_tolerance: 0.2
