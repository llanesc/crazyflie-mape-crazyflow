# Experiment: box_random_spawn
# ACMPC policy with box random spawn positions

# Environment settings
environment:
  n_pairs: 2
  pursuer_strategy: "ProNav"  # "PP" or "ProNav"
  drone_model: "cf2x_L250"

  # Simulation frequencies
  sim_freq: 500
  mellinger_freq: 500
  control_freq: 100
  episode_length_s: 20.0

  # Collision tolerances
  bb_crash_tolerance: 0.2
  rr_crash_tolerance: 0.2
  br_crash_tolerance: 0.2

  # Boundary settings
  boundary_size: 3.0
  min_altitude: 0.1
  max_altitude: 3.0

  # Spawn settings
  spawn:
    blue:
      method: "box_random"
      x_min: 1.5
      x_max: 2.5
      y_half: 1.0
      z_min: 0.8
      z_max: 1.2
    red:
      method: "box_random"
      x_min: -0.5
      x_max: 0.5
      y_half: 1.0
      z_min: 0.8
      z_max: 1.2

  # Pursuit gains (ProNav)
  N_pronav_fb: 5.0
  N_pronav_ff: 1.0
  velocity_closure_threshold: 0.5

  # Pursuit gains (Pure Pursuit)
  pp_k_pxy: 6.1624
  pp_k_vxy: 3.39
  pp_k_pz: 20.0
  pp_k_vz: 10.0

  # Target assignment
  random_target_assignment: true  # true for random, false for deterministic (red_i -> blue_i)

# Policy settings (ACMPC specific)
policy:
  # MPC settings
  mpc_horizon: 2
  mpc_dt: 0.01
  mpc_velocity_max: null  # null to disable, or float value in m/s

  # Control limits
  roll_pitch_max: 0.5
  yaw_max: 0.5

  # Network architecture
  cost_net_sizes: [256, 256]
  value_net_sizes: [256, 256]

  # Activation functions (options: relu, tanh, elu, leaky_relu, gelu)
  cost_net_activation: "relu"
  value_activation: "relu"

  # Exploration
  initial_log_std: -1.2  # or a scalar (e.g. -0.5)

# Training settings
training:
  timesteps: 1_000_000
  n_worlds: 64
  device: "cpu"  # "cpu" or "cuda"

  # PPO hyperparameters
  rollouts: 256
  learning_epochs: 8
  mini_batches: 4
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  grad_norm_clip: 0.5
  entropy_loss_scale: 0.01
  value_loss_scale: 2.0
  ratio_clip: 0.2
  value_clip: 0.2
  kl_threshold: 0.0

  # Value preprocessor (optional)
  # Options: "RunningStandardScaler" or null (no preprocessing)
  value_preprocessor: null

  # Learning rate scheduler (optional)
  # Options: "KLAdaptiveLR", "StepLR", or null (no scheduler)
  # KLAdaptiveLR kwargs: kl_threshold
  # StepLR kwargs: step_size, gamma
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.0

# Reward settings
rewards:
  capture: -10.0
  red_crash: 50.0
  blue_crash: -10.0
  boundary: -10.0
  alive: 0.05
  pursuer_proximity: 0.1
  pursuer_proximity_decay: 2.5
