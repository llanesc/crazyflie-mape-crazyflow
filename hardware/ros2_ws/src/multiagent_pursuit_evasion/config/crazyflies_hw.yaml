# Definition of the various robot types
robot_types:
  cf_blue_hw:
    motion_capture:
      tracking: "vendor"
      marker: default_single_marker
      dynamics: default
    big_quad: false
    battery:
      voltage_warning: 3.8  # V
      voltage_critical: 3.7 # V
    firmware_logging:
      enabled: true
      default_topics:
        pose:
          frequency: 50
      # custom_topics:
      #   body_rates:
      #     frequency: 50
      #     vars: ["stateEstimateZ.rateRoll", "stateEstimateZ.ratePitch", "stateEstimateZ.rateYaw"]
      #   accel:
      #     frequency: 50
      #     vars: ["stateEstimateZ.ax", "stateEstimateZ.ay", "stateEstimateZ.az"]
    firmware_params:
      ring:
        effect: 7 # 6: double spinner, 7: solid color, 16: packetRate
        solidBlue: 255 # if set to solid color
        solidGreen: 0 # if set to solid color
        solidRed: 0 # if set to solid color
        headlightEnable: 0

  cf_red_hw:
    motion_capture:
      tracking: "vendor"
      marker: default_single_marker
      dynamics: default
    big_quad: false
    battery:
      voltage_warning: 3.8  # V
      voltage_critical: 3.7 # V
    firmware_logging:
      enabled: true
      default_topics:
        pose:
          frequency: 50
    firmware_params:
      ring:
        effect: 7 # 6: double spinner, 7: solid color, 16: packetRate
        solidBlue: 0 # if set to solid color
        solidGreen: 0 # if set to solid color
        solidRed: 255 # if set to solid color
        headlightEnable: 0

